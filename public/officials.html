<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="official_dashboard">Officials Dashboard</title>
  <link href="css/variables.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 400px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      width: 100%;
    }

    .stat-card {
      background: var(--bg-card);
      padding: var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      border-left: 4px solid var(--primary);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-icon {
      background: var(--bg-body);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--primary);
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: var(--spacing-lg);
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-progress {
      background: #fef3c7;
      color: #b45309;
    }

    .status-resolved {
      background: #dcfce7;
      color: #15803d;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <nav class="navbar" style="background: white; border-bottom: 2px solid var(--primary);">
    <div class="d-flex align-center gap-2">
      <div
        style="background: var(--primary); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white;">
        <i class="bi bi-building"></i>
      </div>
      <h1 class="mb-0" style="margin:0; font-size: 1.25rem; font-weight: 700;"><span
          data-i18n="official_dashboard">Officials Dashboard</span></h1>
    </div>
    <div class="d-flex align-center gap-2">
      <select id="langSwitcher" class="form-select w-auto" style="padding: 0.4rem 2rem 0.4rem 1rem;">
        <option value="en">🇬🇧 English</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="te">🇮🇳 తెలుగు</option>
        <option value="ta">🇮🇳 தமிழ்</option>
      </select>
      <a href="/officials/logout" class="btn btn-secondary btn-sm" style="padding: 0.4rem 0.8rem;">
        <i class="bi bi-box-arrow-right"></i> <span data-i18n="logout">Logout</span>
      </a>
    </div>
  </nav>

  <div class="container animate-fade-in">

    <!-- Stats Row -->
    <div class="grid mb-4" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--spacing-md);">
      <div class="stat-card" style="border-color: var(--primary);">
        <div class="stat-icon" style="color: var(--primary);"><i class="bi bi-folder2-open"></i></div>
        <div>
          <h3 style="margin:0; font-size: 1.5rem;" id="stat-total">0</h3>
          <p class="text-muted small" style="margin:0;">Total Reports</p>
        </div>
      </div>
      <div class="stat-card" style="border-color: #f59e0b;">
        <div class="stat-icon" style="color: #f59e0b;"><i class="bi bi-hourglass-split"></i></div>
        <div>
          <h3 style="margin:0; font-size: 1.5rem;" id="stat-pending">0</h3>
          <p class="text-muted small" style="margin:0;">In Progress</p>
        </div>
      </div>
      <div class="stat-card" style="border-color: #10b981;">
        <div class="stat-icon" style="color: #10b981;"><i class="bi bi-check-circle-fill"></i></div>
        <div>
          <h3 style="margin:0; font-size: 1.5rem;" id="stat-resolved">0</h3>
          <p class="text-muted small" style="margin:0;">Resolved</p>
        </div>
      </div>
    </div>

    <!-- Map Section -->
    <div class="card mb-4" style="padding: var(--spacing-sm);">
      <div class="d-flex justify-between align-center p-2 mb-2">
        <h4 class="mb-0"><i class="bi bi-map-fill" style="color: var(--secondary);"></i> <span
            data-i18n="reports_map">Reports Map</span></h4>
      </div>
      <div id="map"></div>
    </div>

    <!-- Reports List -->
    <div class="reports-section">
      <h4 class="mb-4 text-muted"><i class="bi bi-list-task"></i> <span data-i18n="all_reports">All Reports</span></h4>
      <div id="reportsList" class="report-grid"></div>
    </div>

  </div>

  <!-- Leaflet + Heatmap -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <script>
    // ---------------------------
    // Map Initialization
    // ---------------------------
    const map = L.map('map').setView([20.5937, 78.9629], 5); // India
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);
    let heatLayer;

    function addReportsToMap(reports) {
      if (heatLayer) map.removeLayer(heatLayer);
      const heatPoints = [];
      reports.forEach(r => {
        if (r.latitude && r.longitude) {
          const lat = parseFloat(r.latitude), lon = parseFloat(r.longitude);
          // Marker
          const marker = L.marker([lat, lon]).addTo(map);
          marker.bindPopup(`
            <b>${r.category}</b><br>
            ${r.text}<br>
            Urgency: ${r.urgency}<br>
            Status: ${r.status}
          `);
          // Heatmap point
          heatPoints.push([lat, lon, r.urgency || 1]);
        }
      });
      heatLayer = L.heatLayer(heatPoints, { radius: 25, blur: 15, maxZoom: 12 }).addTo(map);
    }

    // ---------------------------
    // Reports Loader
    // ---------------------------
    async function loadReports() {
      const res = await fetch("/reports");
      const reports = await res.json();

      // Update Stats
      const total = reports.length;
      const pending = reports.filter(r => r.status === 'in-progress').length;
      const resolved = reports.filter(r => r.status === 'resolved').length;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-pending').innerText = pending;
      document.getElementById('stat-resolved').innerText = resolved;

      addReportsToMap(reports);

      const list = document.getElementById("reportsList");
      list.innerHTML = "";
      reports.forEach(r => {
        const div = document.createElement("div");
        div.className = "card h-100";

        let statusClass = 'status-pending';
        if (r.status === 'in-progress') statusClass = 'status-progress';
        if (r.status === 'resolved') statusClass = 'status-resolved';

        div.innerHTML = `
            <div class="d-flex justify-between mb-2">
              <span class="status-badge ${statusClass}">${r.status}</span>
              <span class="badge bg-danger">Urgency ${r.urgency}</span>
            </div>
            
            <h4 class="mb-2" style="font-size: 1.1rem; color: var(--text-main);">#${r.id} - ${r.category}</h4>
            
            <p class="text-muted small mb-3">${r.text}</p>
            
            ${r.media ? `<img src="${r.media}" class="img-fluid rounded mb-3" style="width:100%; height: 160px; object-fit: cover;">` : ""}
            
            <p class="small text-muted mb-4"><i class="bi bi-geo-alt"></i> ${r.latitude}, ${r.longitude}</p>
            
            <div class="d-flex gap-2 mt-auto pt-3 border-top" style="border-color: var(--border-color)!important;">
              <button onclick="updateStatus(${r.id},'in-progress')" class="btn btn-sm" style="background: #fef3c7; color: #b45309; border:none; flex:1;">Progress</button>
              <button onclick="updateStatus(${r.id},'resolved')" class="btn btn-sm" style="background: #dcfce7; color: #15803d; border:none; flex:1;">Resolve</button>
              <button onclick="deleteReport(${r.id})" class="btn btn-sm btn-outline-danger" style="border: 1px solid var(--accent); color: var(--accent); flex:0;"><i class="bi bi-trash"></i></button>
            </div>
        `;
        list.appendChild(div);
      });

      // Refresh translations
      const event = new Event('change');
      const langSwitcher = document.getElementById("langSwitcher");
      if (langSwitcher) langSwitcher.dispatchEvent(event);
    }

    // ---------------------------
    // Actions
    // ---------------------------
    async function updateStatus(id, status) {
      await fetch(`/report/${id}/status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      loadReports();
    }
    async function deleteReport(id) {
      if (confirm('Are you sure you want to delete this report?')) {
        await fetch(`/report/${id}`, { method: "DELETE" });
        loadReports();
      }
    }

    // ---------------------------
    // Language Switcher
    // ---------------------------
    const translations = {
      en: {
        official_dashboard: "Officials Dashboard",
        reports_map: "Reports Map",
        all_reports: "All Reports",
        logout: "Logout"
      },
      hi: {
        official_dashboard: "अधिकारी डैशबोर्ड",
        reports_map: "रिपोर्ट मानचित्र",
        all_reports: "सभी रिपोर्ट",
        logout: "लॉग आउट"
      },
      te: {
        official_dashboard: "అధికారుల డ్యాష్‌బోర్డ్",
        reports_map: "రిపోర్ట్స్ మ్యాప్",
        all_reports: "అన్ని నివేదికలు",
        logout: "లాగ్ అవుట్"
      },
      ta: {
        official_dashboard: "அதிகாரிகள் கட்டுப்பாட்டு பலகை",
        reports_map: "அறிக்கைகள் வரைபடம்",
        all_reports: "அனைத்து அறிக்கைகள்",
        logout: "வெளியேறு"
      }
    };

    document.getElementById("langSwitcher").addEventListener("change", (e) => {
      const lang = e.target.value;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
    });

    // Load initial reports
    loadReports();
  </script>
</body>

</html>
