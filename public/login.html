<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="officialsLogin">Officials Login</title>
  <link href="css/variables.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <script src="lang.js"></script>
  <style>
    body {
      background: var(--gradient-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated Background Blob */
    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: var(--gradient-primary);
      filter: blur(80px);
      opacity: 0.4;
      border-radius: 50%;
      z-index: -1;
      animation: float 10s infinite alternate;
    }

    @keyframes float {
      0% {
        transform: translate(-50px, -50px) rotate(0deg);
      }

      100% {
        transform: translate(50px, 50px) rotate(20deg);
      }
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: var(--spacing-md);
    }
  </style>
</head>

<body>

  <div class="blob" style="top: -100px; left: -100px;"></div>
  <div class="blob" style="bottom: -100px; right: -100px; background: var(--accent); opacity: 0.3;"></div>

  <div class="login-container animate-fade-in">
    <div class="card glass-card text-center p-5">

      <div class="d-flex justify-between mb-4">
        <div></div> <!-- Spacer -->
        <select id="langSwitcher" class="form-select w-auto" style="min-width: 100px;">
          <option value="en">🇬🇧 English</option>
          <option value="hi">🇮🇳 हिन्दी</option>
          <option value="te">🇮🇳 తెలుగు</option>
          <option value="ta">🇮🇳 தமிழ்</option>
        </select>
      </div>

      <div class="mb-4">
        <i class="bi bi-shield-lock-fill" style="font-size: 3rem; color: var(--primary);"></i>
        <h2 class="mt-3" data-i18n="officialsLogin">Officials Login</h2>
      </div>

      <form method="POST" action="/officials/login">
        <div class="form-group text-left" style="text-align: left;">
          <label class="form-label" data-i18n="username">Username</label>
          <div class="input-group">
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
          </div>
        </div>

        <div class="form-group text-left" style="text-align: left;">
          <label class="form-label" data-i18n="password">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4" data-i18n="login">
          Login <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <p class="mt-4 text-muted small" data-i18n="onlyOfficials">
        Only authorized officials can access this portal.
      </p>
    </div>
  </div>

</body>

</html>
